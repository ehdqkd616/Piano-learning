<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Learning — 실행 제어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Consolas', 'D2Coding', 'Courier New', monospace;
      background: #0f0f1a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #1a1a2e;
      border-bottom: 1px solid #2d2d4e;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }
    .toolbar h2 { font-size: 0.85rem; font-weight: 600; color: #94a3b8; flex: 1; }

    .controls { display: flex; gap: 6px; -webkit-app-region: no-drag; }
    .btn {
      padding: 5px 12px;
      border-radius: 4px;
      border: 1px solid #3d3d5e;
      background: #2d2d4e;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: inherit;
    }
    .btn:hover { background: #3d3d5e; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-electron { border-color: #4ade80; color: #4ade80; }
    .btn-web { border-color: #a78bfa; color: #a78bfa; }
    .btn-stop { border-color: #f87171; color: #f87171; }
    .btn-restart { border-color: #60b8ff; color: #60b8ff; }
    .btn-build { border-color: #facc15; color: #facc15; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #12122a;
      border-bottom: 1px solid #2d2d4e;
      font-size: 0.72rem;
      flex-shrink: 0;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; flex-shrink: 0; }
    .dot.on { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .dot.off { background: #f87171; }

    .tabs {
      display: flex;
      background: #14142a;
      border-bottom: 1px solid #2d2d4e;
      flex-shrink: 0;
    }
    .tab {
      padding: 8px 16px;
      font-size: 0.75rem;
      color: #64748b;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab.active { color: #e2e8f0; border-bottom-color: #60b8ff; }
    .tab-actions { flex: 1; display: flex; justify-content: flex-end; align-items: center; padding-right: 10px; }
    .tab-actions .btn { padding: 2px 8px; font-size: 0.68rem; }

    .panes { flex: 1; position: relative; overflow: hidden; }
    .pane {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 4px 0;
      display: none;
    }
    .pane.active { display: block; }
    .pane::-webkit-scrollbar { width: 6px; }
    .pane::-webkit-scrollbar-track { background: #0f0f1a; }
    .pane::-webkit-scrollbar-thumb { background: #2d2d4e; border-radius: 3px; }

    .log-entry {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 2px 14px;
      font-size: 0.75rem;
      line-height: 1.6;
      border-left: 2px solid transparent;
    }
    .log-entry:hover { background: rgba(255,255,255,0.03); }
    .ts { color: #475569; flex-shrink: 0; font-size: 0.7rem; padding-top: 1px; }
    .badge {
      flex-shrink: 0;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .msg { word-break: break-all; color: #cbd5e1; flex: 1; white-space: pre-wrap; }

    .log-info    { border-left-color: #334155; }
    .log-info .badge    { background: #1e293b; color: #64748b; }
    .log-stdout  { border-left-color: #334155; }
    .log-stdout .badge  { background: #1e293b; color: #94a3b8; }
    .log-stderr  { border-left-color: #f87171; }
    .log-stderr .badge  { background: #2a0f0f; color: #f87171; }
    .log-stderr .msg    { color: #fca5a5; }
    .log-midi    { border-left-color: #4ade80; }
    .log-midi .badge    { background: #14281a; color: #4ade80; }
    .log-midi .msg      { color: #a7f3d0; }
    .log-note    { border-left-color: #60b8ff; }
    .log-note .badge    { background: #0e1f3a; color: #60b8ff; }
    .log-note .msg      { color: #bfdbfe; }
    .log-warn    { border-left-color: #facc15; }
    .log-warn .badge    { background: #292109; color: #facc15; }
    .log-warn .msg      { color: #fef08a; }
    .log-error   { border-left-color: #f87171; }
    .log-error .badge   { background: #2a0f0f; color: #f87171; }
    .log-error .msg     { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h2>🎹 Piano Learning — 실행 제어</h2>
    <div class="controls">
      <button class="btn btn-electron" id="btn-start-electron">Electron으로 실행</button>
      <button class="btn btn-web" id="btn-start-web">웹 브라우저로 실행</button>
      <button class="btn btn-stop" id="btn-stop">중지</button>
      <button class="btn btn-restart" id="btn-restart">재시작</button>
      <button class="btn btn-build" id="btn-build">빌드</button>
    </div>
  </div>

  <div class="status-row">
    <span class="dot off" id="status-dot"></span>
    <span id="status-text">중지됨</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-pane="proc">프로세스 로그</div>
    <div class="tab" data-pane="app">앱 로그</div>
    <div class="tab-actions">
      <button class="btn" id="btn-clear">지우기</button>
    </div>
  </div>

  <div class="panes">
    <div class="pane active" id="pane-proc"></div>
    <div class="pane" id="pane-app"></div>
  </div>

  <script>
    const paneProc = document.getElementById('pane-proc')
    const paneApp = document.getElementById('pane-app')
    const statusDot = document.getElementById('status-dot')
    const statusText = document.getElementById('status-text')
    let activePane = 'proc'

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'))
        document.querySelectorAll('.pane').forEach((p) => p.classList.remove('active'))
        tab.classList.add('active')
        activePane = tab.dataset.pane
        document.getElementById(`pane-${activePane}`).classList.add('active')
      })
    })

    document.getElementById('btn-clear').addEventListener('click', () => {
      document.getElementById(`pane-${activePane}`).innerHTML = ''
    })

    document.getElementById('btn-start-electron').addEventListener('click', () => window.launcherAPI.startElectron())
    document.getElementById('btn-start-web').addEventListener('click', () => window.launcherAPI.startWeb())
    document.getElementById('btn-stop').addEventListener('click', () => window.launcherAPI.stop())
    document.getElementById('btn-restart').addEventListener('click', () => window.launcherAPI.restart())
    document.getElementById('btn-build').addEventListener('click', () => window.launcherAPI.build())

    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    }

    function fmtTime(time) {
      const d = new Date(time)
      const pad = (n) => String(n).padStart(2, '0')
      const ms = String(d.getMilliseconds()).padStart(3, '0')
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${ms}`
    }

    function appendLog(pane, level, message, time) {
      const entry = document.createElement('div')
      entry.className = `log-entry log-${level}`
      entry.innerHTML = `<span class="ts">${fmtTime(time)}</span><span class="badge">${level}</span><span class="msg">${escHtml(message)}</span>`
      const wasAtBottom = pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 20
      pane.appendChild(entry)
      if (wasAtBottom) pane.scrollTop = pane.scrollHeight
    }

    window.launcherAPI.onProcLog(({ stream, line, time }) => {
      appendLog(paneProc, stream, line, time)
    })

    window.launcherAPI.onAppLog(({ level, message, time }) => {
      appendLog(paneApp, level, message, time)
    })

    function renderStatus({ running, mode }) {
      statusDot.className = `dot ${running ? 'on' : 'off'}`
      if (!running) {
        statusText.textContent = '중지됨'
      } else {
        statusText.textContent = mode === 'web' ? '웹 브라우저로 실행 중' : 'Electron으로 실행 중'
      }
    }

    window.launcherAPI.onStatus(renderStatus)
    window.launcherAPI.getStatus().then(renderStatus)
  </script>
</body>
</html>
